<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
    <defs>
        <!-- Background Forest Green Gradient -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1f5a41" />
            <stop offset="45%" stop-color="#143e2d" />
            <stop offset="100%" stop-color="#0b2319" />
        </linearGradient>

        <!-- Luxury Gold Gradient -->
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fff5d6" />
            <stop offset="28%" stop-color="#f5d37f" />
            <stop offset="70%" stop-color="#d49b3d" />
            <stop offset="100%" stop-color="#9e6d20" />
        </linearGradient>

        <!-- Star Glow Gold Gradient -->
        <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="35%" stop-color="#ffecb3" />
            <stop offset="80%" stop-color="#e5b35a" />
            <stop offset="100%" stop-color="#b8832a" />
        </linearGradient>

        <!-- Subtle Inner Border Highlight -->
        <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f5d37f" stop-opacity="0.75" />
            <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15" />
            <stop offset="100%" stop-color="#d49b3d" stop-opacity="0.6" />
        </linearGradient>

        <!-- Drop Shadow for the "D" and Star -->
        <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#000000" flood-opacity="0.45" />
            <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#f5d37f" flood-opacity="0.35" />
        </filter>
    </defs>

    <!-- Main Shield / Squircle Container -->
    <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

    <!-- Subtle Diagonal Gloss Stripe -->
    <path d="M6 34 C6 18.5 18.5 6 34 6 L86 6 C96 6 104 11 109 19 L20 108 C11 103 6 95 6 86 Z" fill="#ffffff" opacity="0.04" />

    <!-- Monogram: Modern Elegant "D" & Shopping Arch -->
    <g filter="url(#goldGlow)">
        <!-- Outer Stem & Curve of Capital D -->
        <path d="M34 27 C34 24.8 35.8 23 38 23 L62 23 C79.5 23 91 34.5 91 52 C91 69.5 79.5 81 62 81 L38 81 C35.8 81 34 79.2 34 77 Z M47 35 L47 69 L61 69 C71.5 69 78 62 78 52 C78 42 71.5 35 61 35 Z" fill="url(#goldGrad)" fill-rule="evenodd" />

        <!-- 4-Point Radiant Spark Star (Dara = Star) floating inside/top-right of D -->
        <g transform="translate(62, 52)">
            <!-- Central Shining 4-point Star -->
            <path d="M0 -22 C0 -6 6 0 22 0 C6 0 0 6 0 22 C0 6 -6 0 -22 0 C-6 0 0 -6 0 -22 Z" fill="url(#starGrad)" />
            <!-- Star Core Diamond Light -->
            <circle cx="0" cy="0" r="3" fill="#ffffff" />
        </g>
    </g>

    <!-- Mini Ambient Corner Sparkle -->
    <path d="M88 24 C88 20 89.5 18.5 93.5 18.5 C89.5 18.5 88 17 88 13 C88 17 86.5 18.5 82.5 18.5 C86.5 18.5 88 20 88 24 Z" fill="#fff5d6" opacity="0.85" />
</svg>
